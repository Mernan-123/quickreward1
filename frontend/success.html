<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Your Harborline Finance application inquiry has been received.">
  <title>Inquiry received | Harborline Finance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="success-page">
  <header class="nav success-nav">
    <div class="nav-inner">
      <a class="brand" href="index.html" aria-label="Harborline Finance home">
        <span class="brand-mark" aria-hidden="true">H</span>
        <span class="brand-copy">
          <span class="brand-name"><span class="brand-harborline">Harborline</span> <span class="brand-finance">Finance</span></span>
          <span class="brand-tagline">Loan &amp; Reward</span>
        </span>
      </a>
    </div>
  </header>
  <main class="success-shell container">
    <div class="success-card">
      <div class="success-icon">✓</div>
      <p class="eyebrow">APPLICATION RECEIVED</p>
      <h1>Inquiry submitted</h1>
      <p class="success-copy">Thank you. Your application inquiry has been received. Keep this reference number when following up. This confirmation is not a loan approval or offer.</p>

      <div class="reference-box">
        <span>Reference number</span>
        <strong id="reference">—</strong>
      </div>

      <div class="success-actions">
        <a href="index.html" class="btn">Back to home</a>
      </div>
    </div>
  </main>

  <script>
    const p = new URLSearchParams(location.search);
    document.getElementById("reference").textContent = p.get("ref") || "Not available";
  </script>
</body>
</html>
